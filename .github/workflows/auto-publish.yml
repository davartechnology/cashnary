name: Generate Daily Articles

on:
  schedule:
    - cron: '0 7 * * *'   # 7h00 UTC tous les jours (article matin)
    - cron: '0 19 * * *'  # 19h00 UTC tous les jours (article soir)
  workflow_dispatch:       # Permet de lancer manuellement

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate.js

      - name: Commit and push articles
        run: |
          git config --global user.name "CASHNARY Bot"
          git config --global user.email "bot@cashnary.com"
          git add content/
          git diff --staged --quiet || git commit -m "🤖 Auto: 2 nouveaux articles $(date +'%Y-%m-%d %H:%M')"
          git push
