<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Decorative gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5D76E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Subtle pattern -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#D4AF37" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Main title -->
  <text x="600" y="280" 
        font-family="'Trebuchet MS', 'Lucida Grande', sans-serif" 
        font-size="120" 
        font-weight="bold" 
        fill="url(#goldGradient)" 
        text-anchor="middle"
        letter-spacing="8">
    CASHNARY
  </text>
  
  <!-- Underline -->
  <line x1="300" y1="310" x2="900" y2="310" stroke="#D4AF37" stroke-width="2" opacity="0.5"/>
  
  <!-- Subtitle -->
  <text x="600" y="380" 
        font-family="'Trebuchet MS', 'Lucida Grande', sans-serif" 
        font-size="32" 
        fill="#FFFFFF" 
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.8">
    Stratégies pour gagner de l'argent en ligne
  </text>
  
  <!-- Bottom decoration -->
  <rect x="0" y="580" width="1200" height="4" fill="url(#goldGradient)"/>
</svg>